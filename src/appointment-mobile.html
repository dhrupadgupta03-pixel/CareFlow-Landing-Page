<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Appointment Selection Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f756d",
                        "accent-coral": "#F43F5E",
                        "background-light": "#FAFAF9", // Off-White
                        "background-dark": "#112120",
                        "surface-white": "#FFFFFF",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .ios-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }
        .ios-safe-top {
            padding-top: env(safe-area-inset-top, 44px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-display text-[#111717] antialiased">
<!-- Header -->
<header class="ios-safe-top sticky top-0 z-50 bg-background-light/80 backdrop-blur-md border-b border-primary/5">
<div class="flex items-center justify-between px-6 py-4">
<div class="w-10">
<button class="flex items-center justify-center text-primary">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
</div>
<div class="flex-1 flex justify-center">
<!-- Clinic Logo Simulation -->
<div class="flex items-center gap-2">
<div class="size-8 bg-primary rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl">medical_services</span>
</div>
<h1 class="text-primary font-bold text-lg tracking-tight">ELITE CLINIC</h1>
</div>
</div>
<div class="w-10"></div>
</div>
</header>
<main class="px-6 py-8 space-y-8 pb-32">
<!-- Introduction -->
<div class="space-y-1">
<h2 class="text-2xl font-bold tracking-tight text-primary">Schedule Visit</h2>
<p class="text-primary/60 text-sm">Select your preferred date and time for consultation.</p>
</div>
<!-- Calendar Card -->
<section class="bg-surface-white rounded-xl shadow-lg shadow-primary/5 p-6">
<div class="flex items-center justify-between mb-6">
<button class="size-10 flex items-center justify-center rounded-full hover:bg-background-light text-primary transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<p class="text-primary font-bold text-lg">October 2023</p>
<button class="size-10 flex items-center justify-center rounded-full hover:bg-background-light text-primary transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 text-center mb-2">
<p class="text-primary/40 text-xs font-bold py-2">SUN</p>
<p class="text-primary/40 text-xs font-bold py-2">MON</p>
<p class="text-primary/40 text-xs font-bold py-2">TUE</p>
<p class="text-primary/40 text-xs font-bold py-2">WED</p>
<p class="text-primary/40 text-xs font-bold py-2">THU</p>
<p class="text-primary/40 text-xs font-bold py-2">FRI</p>
<p class="text-primary/40 text-xs font-bold py-2">SAT</p>
</div>
<div class="grid grid-cols-7 gap-y-1 text-center">
<!-- Days before 1st -->
<div class="h-11"></div>
<div class="h-11"></div>
<div class="h-11"></div>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">1</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">2</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">3</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">4</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-bold bg-primary text-white rounded-full shadow-md shadow-primary/30">5</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">6</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">7</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">8</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">9</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">10</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">11</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full text-primary/30 cursor-not-allowed">12</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">13</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">14</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">15</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">16</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">17</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">18</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">19</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">20</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">21</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">22</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">23</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">24</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">25</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">26</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">27</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full">28</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full text-primary/30">29</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full text-primary/30">30</button>
<button class="h-11 w-full flex items-center justify-center text-sm font-medium hover:bg-primary/5 rounded-full text-primary/30">31</button>
</div>
</section>
<!-- Time Slots -->
<section class="space-y-6">
<!-- Morning -->
<div>
<h3 class="font-serif text-xl text-primary mb-4">Morning</h3>
<div class="grid grid-cols-3 gap-3">
<button class="py-3 px-4 rounded-full border border-primary/20 bg-surface-white text-primary text-sm font-medium hover:border-primary transition-all">09:00 AM</button>
<button class="py-3 px-4 rounded-full border border-primary text-primary bg-surface-white text-sm font-medium">09:30 AM</button>
<button class="py-3 px-4 rounded-full bg-primary text-white text-sm font-bold shadow-md shadow-primary/20">10:00 AM</button>
<button class="py-3 px-4 rounded-full bg-primary/5 text-primary/30 text-sm font-medium cursor-not-allowed border border-transparent">
<span class="line-through">11:00 AM</span>
</button>
<button class="py-3 px-4 rounded-full border border-primary/20 bg-surface-white text-primary text-sm font-medium hover:border-primary transition-all">11:30 AM</button>
</div>
</div>
<!-- Afternoon -->
<div>
<h3 class="font-serif text-xl text-primary mb-4">Afternoon</h3>
<div class="grid grid-cols-3 gap-3">
<button class="py-3 px-4 rounded-full border border-primary/20 bg-surface-white text-primary text-sm font-medium hover:border-primary transition-all">01:00 PM</button>
<button class="py-3 px-4 rounded-full border border-primary/20 bg-surface-white text-primary text-sm font-medium hover:border-primary transition-all">01:30 PM</button>
<button class="py-3 px-4 rounded-full border border-primary/20 bg-surface-white text-primary text-sm font-medium hover:border-primary transition-all">02:00 PM</button>
<button class="py-3 px-4 rounded-full bg-primary/5 text-primary/30 text-sm font-medium cursor-not-allowed border border-transparent">
<span class="line-through">03:30 PM</span>
</button>
<button class="py-3 px-4 rounded-full border border-primary/20 bg-surface-white text-primary text-sm font-medium hover:border-primary transition-all">04:00 PM</button>
<button class="py-3 px-4 rounded-full border border-primary/20 bg-surface-white text-primary text-sm font-medium hover:border-primary transition-all">05:00 PM</button>
</div>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 right-0 ios-safe-bottom bg-surface-white/80 backdrop-blur-xl border-t border-primary/5 shadow-2xl z-50">
<div class="p-6 max-w-lg mx-auto flex flex-col gap-4">
<div class="flex items-center justify-between text-xs font-semibold uppercase tracking-widest text-primary/60 px-2">
<span>Oct 5, 2023</span>
<span class="size-1 bg-primary/30 rounded-full"></span>
<span>10:00 AM</span>
</div>
<button class="w-full bg-accent-coral text-white font-bold py-4 rounded-full shadow-lg shadow-accent-coral/30 hover:scale-[0.98] active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Continue to Details</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
